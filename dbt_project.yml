name: athlete_data
version: "1.0.0"
config-version: 2
profile: athlete_data

flags:
  send_anonymous_usage_stats: false

model-paths: ["models"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
analysis-paths: ["analyses"]
docs-paths: ["models", "docs/blocks"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

# Raw data stay where they were delivered; dbt reads them in place.
vars:
  raw_dir: "data/raw/soccermon/subjective"
  derived_dir: "data/derived"
  # A report of the same body location more than this many days after the
  # previous one opens a new injury episode.
  injury_episode_gap_days: 7

models:
  athlete_data:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts

seeds:
  athlete_data:
    +schema: reference

data_tests:
  athlete_data:
    +store_failures: true
    +schema: audit
